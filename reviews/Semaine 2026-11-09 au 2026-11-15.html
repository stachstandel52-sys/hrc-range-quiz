<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* Revue hebdo : barre fixe (semaine + onglets), puis l'accueil ou l'outil choisi en plein écran. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --ink:#15211c; --muted:#5b6a63; --line:#d6ded9;
  --felt:#1d5c47; --felt-ink:#e9f3ee; --accent:#1f7a5a; --accent-soft:#dcefe6;
  --good:#2f8a55; --warn:#c48a12; --bad:#c2402f;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#161f1b; --ink:#e4ebe7; --muted:#92a199; --line:#26332d;
  --felt:#143f31; --felt-ink:#dcebe3; --accent:#45c08e; --accent-soft:#183a2d;
  --good:#4cc07c; --warn:#e0a83a; --bad:#ec6a58; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161f1b; --ink:#e4ebe7; --muted:#92a199; --line:#26332d;
  --felt:#143f31; --felt-ink:#dcebe3; --accent:#45c08e; --accent-soft:#183a2d;
  --good:#4cc07c; --warn:#e0a83a; --bad:#ec6a58; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
button,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* barre */
.bar{background:var(--felt);color:var(--felt-ink);flex:none;position:sticky;top:0;z-index:5}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px max(16px,env(safe-area-inset-left,0px)) 0}
.brand{font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.week{display:flex;align-items:center;gap:4px;min-width:0;flex:1 1 260px}
.week select{flex:1;min-width:0;max-width:340px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 8px;color:var(--felt-ink)}
.week select option{color:#15211c;background:#fff}
.arrow{background:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--felt-ink);font-size:1.1rem;line-height:1}
.arrow:disabled{opacity:.35;cursor:default}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:8px max(16px,env(safe-area-inset-left,0px)) 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-radius:8px 8px 0 0;padding:8px 14px;cursor:pointer;color:var(--felt-ink);opacity:.75;font-family:var(--display);font-weight:600;font-size:1rem;white-space:nowrap}
.tab:hover{opacity:1}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}
.tab:disabled{opacity:.3;cursor:default}
.tab .c{font-family:var(--mono);font-size:.78rem;margin-left:6px;opacity:.8}


/* évolution semaine par semaine */
const E = M.evo || {weeks:[], metrics:[]};
const nf = (x,d=1) => x==null ? '—' : x.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
function evoHTML(){
  if(!E.weeks.length) return '';
  const cards = E.metrics.map(mt=>{
    const pts = E.weeks.map((w,i)=>({i,w,v:w.vals[mt.id]})).filter(p=>p.v);
    if(!pts.length) return `<div class="ec"><h3>${esc(mt.label)}</h3><div class="sub">${esc(mt.desc)}</div><div class="none">Pas encore revu.</div></div>`;
    const cur = pts.find(p=>p.w.cur) || pts[pts.length-1];
    const prev = pts.filter(p=>p.i<cur.i);
    let trend = '';
    if(prev.length){
      const avg = prev.reduce((a,p)=>a+p.v.rate,0)/prev.length, d = cur.v.rate-avg;
      const cls = Math.abs(d)<0.05*Math.max(avg,0.5) ? 'flat' : d<0 ? 'down' : 'up';
      trend = `<span class="trend ${cls}" title="par rapport à la moyenne des semaines précédentes">${cls==='down'?'▼':cls==='up'?'▲':'='} ${d>0?'+':''}${nf(d)} vs moyenne</span>`;
    }
    const W=300,H=118,L=30,R=10,T=10,B=22, n=E.weeks.length;
    const max = Math.max(1, ...pts.map(p=>p.v.rate)); const top = Math.ceil(max*1.15*2)/2;
    const x = i => n===1 ? L+(W-L-R)/2 : L + i*(W-L-R)/(n-1);
    const y = v => T + (H-T-B)*(1 - v/top);
    let path='', on=false;
    E.weeks.forEach((w,i)=>{const v=w.vals[mt.id]; if(v){path+=(on?'L':'M')+x(i).toFixed(1)+' '+y(v.rate).toFixed(1); on=true;} else on=false;});
    const ticks = [0, top/2, top];
    const lbl = new Set([0, n-1, E.weeks.findIndex(w=>w.cur)]);
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(mt.label)} pour 1000 mains, par semaine">
      ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L-6}" y="${y(t)+4}" text-anchor="end">${nf(t, t%1?1:0)}</text>`).join('')}
      ${E.weeks.map((w,i)=>lbl.has(i)?`<text class="ax" x="${x(i)}" y="${H-4}" text-anchor="${i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'}">${w.short}</text>`:'').join('')}
      <path class="ln" d="${path}"/>
      ${pts.map(p=>`<circle class="pt${p.w.cur?' cur':''}" cx="${x(p.i)}" cy="${y(p.v.rate)}" r="${p.w.cur?5:4}"/>`).join('')}
      ${pts.map(p=>`<circle class="hit" cx="${x(p.i)}" cy="${y(p.v.rate)}" r="13" data-tip="${esc(p.w.label)}|${nf(p.v.rate,2)}|${p.v.n}|${p.v.hands}"/>`).join('')}
    </svg>`;
    return `<div class="ec${mt.big?' big':''}"><h3>${esc(mt.label)}</h3><div class="sub">${esc(mt.desc)}</div>
      <div class="now"><b>${nf(cur.v.rate,2)}</b><span>pour 1 000 mains${cur.w.cur?' cette semaine':' ('+cur.w.short+')'} · ${cur.v.n} sur ${cur.v.hands.toLocaleString('fr-FR')} mains</span>${trend}</div>${svg}</div>`;
  }).join('');
  const table = `<details class="tbl"><summary>Voir le tableau</summary><div class="tw"><table><thead><tr><th>Semaine</th><th>Mains</th>${E.metrics.map(m=>`<th>${esc(m.label)}</th>`).join('')}</tr></thead><tbody>${
    E.weeks.slice().reverse().map(w=>`<tr class="${w.cur?'cur':''}"><td>${esc(w.label.replace('Semaine du ',''))}</td><td>${w.hands.toLocaleString('fr-FR')}</td>${E.metrics.map(m=>{const v=w.vals[m.id];return `<td>${v?nf(v.rate,2)+' <span style="color:var(--muted)">('+v.n+')</span>':'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  return `<section style="display:flex;flex-direction:column;gap:12px" aria-label="Évolution">
    <div class="evo-head"><h2>Ton évolution</h2><span class="note">Erreurs pour 1 000 mains, semaine par semaine (semaines sans jeu ignorées). Plus bas = mieux.</span></div>
    <div class="evo">${cards}</div>${table}
    <p class="note">Une revue encore en cours (par exemple les spots turn restants) n'est comptée que lorsqu'elle est terminée.</p>
  </section>`;
}

/* accueil */

.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700;line-height:1.05;margin-top:4px}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.off{cursor:default;opacity:.55}
.card.off:hover{border-color:var(--line);transform:none}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2{font-size:1.3rem}
.tag{font-family:var(--display);font-weight:600;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 7px}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
.stat{font-size:.92rem;color:var(--muted)}
.stat b{font-family:var(--mono);color:var(--ink);font-weight:700;margin-right:4px}
.stat.bad b{color:var(--bad)}
.stat.good b{color:var(--good)}
.go{font-family:var(--display);font-weight:600;color:var(--accent)}
.note{color:var(--muted);font-size:.85rem}


/* évolution */
.evo-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.evo-head h2{font-size:1.5rem}
.evo{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.ec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 16px 10px;display:flex;flex-direction:column;gap:6px;position:relative}
.ec h3{font-size:1.05rem}
.ec.big{grid-column:1/-1;border-color:var(--accent)}
.ec.big h3{font-size:1.25rem}
.ec.big svg{max-height:180px}
.ec .sub{color:var(--muted);font-size:.85rem;line-height:1.3}
.ec .now{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ec .now b{font-family:var(--mono);font-size:1.6rem;line-height:1}
.ec .now span{color:var(--muted);font-size:.85rem}
.trend{font-size:.82rem;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.trend.up{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.trend.down{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.trend.flat{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}
.ec svg{width:100%;height:auto;display:block;overflow:visible}
.ec svg .grid{stroke:var(--line);stroke-width:1}
.ec svg .ax{fill:var(--muted);font:11px var(--mono)}
.ec svg .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ec svg .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ec svg .pt.cur{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.ec svg .hit{fill:transparent;cursor:pointer}
.ec .none{color:var(--muted);font-size:.9rem;padding:18px 0}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;line-height:1.35;padding:6px 9px;border-radius:8px;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{font-family:var(--mono)}
details.tbl summary{cursor:pointer;color:var(--accent);font-weight:600}
.tw{overflow-x:auto;margin-top:8px}
.tw table{border-collapse:collapse;font-size:.88rem;min-width:100%}
.tw th,.tw td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tw th:first-child,.tw td:first-child{text-align:left}
.tw th{color:var(--muted);font-weight:600;font-size:.8rem}
.tw tr.cur td{font-weight:700}

/* outil */
.frame{border:0;width:100%;height:100%;display:block;background:var(--bg)}
[hidden]{display:none!important}

<script type="application/json" id="tool-sb">"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>SB Spot Trainer\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap\">\n\u003cstyle>\n/* Layout: one study column — session strip, the spot on a felt panel, the answer, then the spot list. */\n:root{\n  --bg:#eef2ef; --surface:#ffffff; --ink:#15211c; --muted:#5b6a63; --line:#d6ded9;\n  --felt:#1d5c47; --felt-ink:#e9f3ee; --accent:#1f7a5a; --accent-soft:#dcefe6;\n  --raise:#d0473b; --call:#3f9a5e; --fold:#4b7fb6;\n  --good:#2f8a55; --warn:#c48a12; --bad:#c2402f;\n  --s:#1b1f1d; --h:#d0332b; --d:#2f6fc4; --c:#2c8a45; --card:#ffffff;\n  --display:\"Barlow Semi Condensed\",\"Arial Narrow\",Arial,sans-serif;\n  --body:\"Source Sans 3\",\"Segoe UI\",system-ui,sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0e1412; --surface:#161f1b; --ink:#e4ebe7; --muted:#92a199; --line:#26332d;\n  --felt:#143f31; --felt-ink:#dcebe3; --accent:#45c08e; --accent-soft:#183a2d;\n  --raise:#e5645a; --call:#56b878; --fold:#6a9ad0; --good:#4cc07c; --warn:#e0a83a; --bad:#ec6a58;\n  --s:#1b1f1d; --h:#d0332b; --d:#2f6fc4; --c:#2c8a45; --card:#f4f6f5; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0e1412; --surface:#161f1b; --ink:#e4ebe7; --muted:#92a199; --line:#26332d;\n  --felt:#143f31; --felt-ink:#dcebe3; --accent:#45c08e; --accent-soft:#183a2d;\n  --raise:#e5645a; --call:#56b878; --fold:#6a9ad0; --good:#4cc07c; --warn:#e0a83a; --bad:#ec6a58;\n  --s:#1b1f1d; --h:#d0332b; --d:#2f6fc4; --c:#2c8a45; --card:#f4f6f5; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}\n.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}\nh1,h2,h3{font-family:var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}\nh1{font-size:2rem;font-weight:700;line-height:1.05}\nh2{font-size:1.25rem;font-weight:600}\n.eyebrow{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}\n.muted{color:var(--muted)}\n.num{font-family:var(--mono);font-variant-numeric:tabular-nums}\nheader{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}\n.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\nselect,button{font:inherit;color:inherit}\nselect{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}\n.chips{display:flex;flex-wrap:wrap;gap:6px}\n.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.9rem;cursor:pointer}\n.chip[aria-pressed=\"true\"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n.chip:focus-visible,.btn:focus-visible,.act:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n\n.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}\n.stat b{font-family:var(--mono);font-size:1.4rem;font-weight:700}\n.stat span{font-size:.85rem;color:var(--muted)}\n.stat.flag b{color:var(--bad)}\n.note{font-size:.9rem;color:var(--muted);max-width:70ch}\n\n.spot{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}\n.spot-head{display:flex;flex-wrap:wrap }}\nfunction grade(spot,key){\n  const a=spot.actions, f=(a.find(x=>x.key===key)||{}).freq||0, max=Math.max(...a.map(x=>x.freq));\n  const cr=(a.find(x=>x.key===\"raise\")||{}).freq||0;\n  if(spot.street!==\"preflop\"&&cr>10){\n    if(key===\"raise\") return {g:\"best\",t:\"Check-raise. Correct\",d:`GTO check-raises this ${cr}% of the time. Your rule: anything above 10% is a check-raise.`};\n    return {g:\"miss\",t:\"Missed check-raise\",d:`GTO check-raises this ${cr}% of the time, so by your rule (above 10%) this is a check-raise. GTO's ${key} frequency: ${f}%.`};\n  }\n  if(f>=max-3) return {g:\"best\",t:\"Best play\",d:\"This is GTO's main action with your hand.\"};\n  if(f>=25) return {g:\"fine\",t:\"Fine, GTO mixes it\",d:`GTO takes this ${f}% of the time.`};\n  if(f>=10) return {g:\"inacc\",t:\"Inaccurate\",d:`GTO only takes this ${f}% of the time.`};\n  return {g:\"miss\",t:\"Mistake\",d:f?`GTO takes this only ${f}% of the time.`:\"GTO never takes this action with your hand.\"};\n}\nfunction base(){\n  return S.spots.filter(s=>S.session===\"all\"||s.session===S.session)\n    .filter(s=>S.street===\"any\"||s.street===S.street)\n    .sort((a,b)=>a.session===b.session?(a.order||0)-(b.order||0):(a.session\u003cb.session?1:-1));\n}\nfunction view(){\n  const l=base();\n  if(S.order===\"shuffle\"){\n    if(!S.seq||S.seq.length!==l.length||!S.seq.every(id=>l.some(s=>s.id===id))){S.seq=l.map(s=>s.id).sort(()=>Math.random()-.5);}\n    return S.seq.map(id=>l.find(s=>s.id===id));\n  }\n  if(S.order===\"weak\"){\n    const sc=s=>{const a=S.answers[s.id];return a?a.best/a.n:-1;};\n    return l.slice().sort((a,b)=>sc(a)-sc(b));\n  }\n  return l;\n}\nfunction renderSummary(){\n  const xs=S.session===\"all\"?S.sessions:S.sessions.filter(s=>s.id===S.session);\n  if(!xs.length){$(\"#summary\").innerHTML=\"\";return;}\n  const sum=k=>xs.reduce((t,x)=>t+(x[k]||0),0);\n  const st=(v,l,flag)=>`\u003cdiv class=\"stat${flag&&v>0?\" flag\":\"\"}\">\u003cb class=\"num\">${v}\u003c/b>\u003cspan>${l}\u003c/span>\u003c/div>`;\n  const note=S.session===\"all\"?`${xs.length} sessions. Scope: SB vs LJ/HJ/CO/BTN opens, heads-up pots, blind vs blind excluded. Preflop: folds where GTO continues more than 10%. Flop: missed check-raises (GTO raises more than 10%) and bad check-raises (GTO raises under 10%).`:(xs[0].note||\"\");\n  $(\"#summary\").innerHTML=`\u003cdiv class=\"strip\">${st(sum(\"hands\"),\"hands reviewed\")}${st(sum(\"preflopSpots\"),\"SB vs open spots\")}${st(sum(\"missedDefenses\"),\"missed defenses\",1)}${st(sum(\"missedCheckRaises\"),\"missed check-raises\",1)}${st(sum(\"badCheckRaises\"),\"bad check-raises\",1)}\u003c/div>\u003cp class=\"note\">${esc(note)}\u003c/p>`;\n}\nfunction renderSpot(){\n  const list=view(), el=$(\"#spot\");\n  if(!list.length){el.innerHTML=`\u003cdiv class=\"state\">No spots in this view.\u003c/div>`;renderRows();return;}\n  S.idx=Math.min(S.idx,list.length-1);\n  const s=list[S.idx], answered=S.picked!==null;\n  const acts=s.actions.map(a=>{\n    const picked=S.picked===a.key;\n    return `\u003cbutton class=\"act${picked?\" picked\":\"\"}\" data-k=\"${a.key}\" ${answered?\"disabled\":\"\"}>\n      \u003cspan>${esc(a.label)}\u003c/span>\n      ${answered?`\u003cspan class=\"bar\">\u003ci style=\"width:${a.freq}%;background:${col(a.key)}\">\u003c/i>\u003c/span>\u003cspan class=\"pct num\">GTO ${a.freq}%\u003c/span>`:\"\"}\n    \u003c/button>`;}).join(\"\");\n  let after=\"\";\n  if(answered){\n    const g=grade(s,S.picked), tbl=s.actions.find(a=>a.key===s.heroAction);\n    after=`\u003cdiv class=\"verdict ${g.g}\">\u003cdiv>\u003cb>${g.t}\u003c/b>\u003cdiv>${g.d}\u003c/div>\u003c/div>\u003c/div>\n      \u003cp class=\"lesson\">${esc(s.lesson)}\u003c/p>\n      \u003cdiv class=\"meta\">\u003cspan>Spot type: \u003cb>${esc(KIND[s.kind]||s.kind)}\u003c/b>. At the table you chose \u003cb>${esc(tbl?tbl.label:s.heroAction)}\u003c/b> (GTO ${tbl?tbl.freq:\"?\"}%).\u003c/span>\n      \u003cspan>${esc(s.source.label)}. ${esc(s.source.mapping)}\u003c/span>\n      \u003ca href=\"${esc(s.source.url)}\" target=\"_blank\" rel=\"noopener\">Open this spot in GTO Wizard\u003c/a>\u003c/div>`;\n  }\n  const sx=S.sessions.find(x=>x.id===s.session);\n  const dots=list.map((x,i)=>`\u003cbutton class=\"dot ${i===S.idx?\"cur \":\"\"}${S.answers[x.id]?S.answers[x.id].lastGrade:\"\"}\" data-i=\"${i}\" aria-label=\"Spot ${i+1}\">\u003c/button>`).join(\"\");\n  el.innerHTML=`\u003cdiv class=\"spot-head\">\u003cspan class=\"street\">${s.street.toUpperCase()}\u003c/span>\n      \u003cspan class=\"num\">${esc(s.heroPos)} vs ${esc(s.villainPos)} · ${s.effBB}bb eff\u003c/span>\n      \u003cspan class=\"muted\">${esc(s.tournament)} · ${esc(s.blinds)}\u003c/span>\n      \u003cspan class=\"tag\">${esc(sx?sx.label.replace(\"Winamax · \",\"\"):s.session)}\u003c/span>\u003c/div>\n    \u003cdiv class=\"felt\">\u003cul class=\"line\">${s.line.map(l=>`\u003cli>${esc(l)}\u003c/li>`).join(\"\")}\u003c/ul>\n      \u003cdiv class=\"board\">${s.board.length?s.board.map(c=>card(c)).join(\"\"):`\u003cspan class=\"empty\">Preflop\u003c/span>`}\u003c/div>\n      \u003cdiv class=\"pot\">\u003cspan class=\"eyebrow\" style=\"color:inherit;opacity:.8\">Pot\u003c/span>\u003cb>${s.potBB}bb\u003c/b>\u003c/div>\n      \u003cdiv class=\"facing\">${esc(s.facing)}\u003c/div>\n      \u003cdiv class=\"hero\">\u003cspan class=\"who\">You · SB\u003c/span>${s.heroCards.map(c=>card(c,1)).join(\"\")}\u003c/div>\u003c/div>\n    \u003cdiv class=\"ask\">\u003cp>${esc(s.question)}\u003c/p>\u003cdiv class=\"acts\">${acts}\u003c/div>${after}\u003c/div>\n    \u003cdiv class=\"nav\">\u003cbutton class=\"btn\" id=\"prev\" ${S.idx===0?\"disabled\":\"\"}>Previous\u003c/button>\u003cdiv class=\"dots\">${dots}\u003c/div>\n      \u003cbutton class=\"btn primary\" id=\"next\">${S.idx===list.length-1?\"Start over\":\"Next spot\"}\u003c/button>\u003c/div>`;\n  el.querySelectorAll(\".act\").forEach(b=>b.onclick=()=>answer(s,b.dataset.k));\n  el.querySelectorAll(\".dot\").forEach(b=>b.onclick=()=>go(+b.dataset.i));\n  $(\"#prev\").onclick=()=>go(S.idx-1);\n  $(\"#next\").onclick=()=>{if(S.idx===list.length-1&&S.order===\"shuffle\")S.seq=null;go(S.idx===list.length-1?0:S.idx+1);};\n  renderRows();\n}\nfunction go(i){S.idx=i;S.picked=null;renderSpot();}\nfunction renderRows(){\n  const list=view();\n  $(\"#rows\").innerHTML=list.map((s,i)=>{\n    const a=S.answers[s.id];\n    const top=s.actions.reduce((p,c)=>c.freq>p.freq?c:p), tbl=s.actions.find(x=>x.key===s.heroAction)||{label:s.heroAction};\n    const h='\u003cspan class=\"hidden-cell\">answer to reveal\u003c/span>';\n    return `\u003ctr data-i=\"${i}\">\u003ctd class=\"num\">${i+1}\u003c/td>\u003ctd>${s.street}\u003c/td>\u003ctd>\u003cspan class=\"mini\">${mini(s.heroCards)}\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"mini\">${s.board.length?mini(s.board):\"—\"}\u003c/span>\u003c/td>\u003ctd>SB vs ${esc(s.villainPos)}${a?\" · \"+esc(KIND[s.kind]||s.kind):\"\"}\u003c/td>\u003ctd>${a?esc(tbl.label):h}\u003c/td>\u003ctd>${a?`${esc(top.label)} \u003cspan class=\"muted num\">${top.freq}%\u003c/span>`:h}\u003c/td>\u003ctd>${a?`\u003cspan class=\"num\">${a.best}/${a.n}\u003c/span> good`:'\u003cspan class=\"muted\">not tried\u003c/span>'}\u003c/td>\u003c/tr>`;}).join(\"\")||`\u003ctr>\u003ctd colspan=\"8\" class=\"muted\">Nothing in this view.\u003c/td>\u003c/tr>`;\n  document.querySelectorAll(\"#rows tr[data-i]\").forEach(r=>r.onclick=()=>{go(+r.dataset.i);$(\"#spot\").scrollIntoView({behavior:\"smooth\",block:\"start\"});});\n}\nfunction answer(s,key){\n  S.picked=key; const g=grade(s,key);\n  const a=S.answers[s.id]||{n:0,best:0};\n  S.answers[s.id]={n:a.n+1,best:a.best+(g.g===\"best\"||g.g===\"fine\"?1:0),lastGrade:g.g,lastAt:new Date().toISOString()};\n  save(); renderSpot();\n}\nfunction renderSessions(){\n  const ids=[...new Set(S.sessions.map(s=>s.id).concat(S.spots.map(s=>s.session)))].sort().reverse();\n  $(\"#sess\").innerHTML=`\u003coption value=\"all\">All sessions (${S.spots.length} spots)\u003c/option>`+ids.map(id=>{const x=S.sessions.find(s=>s.id===id);const n=S.spots.filter(s=>s.session===id).length;return `\u003coption value=\"${id}\" ${id===S.session?\"selected\":\"\"}>${esc(x?x.label:id)} (${n})\u003c/option>`;}).join(\"\");\n  $(\"#sess\").value=S.session;\n}\n$(\"#sess\").onchange=e=>{S.session=e.target.value;S.idx=0;S.picked=null;S.seq=null;renderSummary();renderSpot();};\n$(\"#filters\").onclick=e=>{const b=e.target.closest(\".chip\");if(!b)return;\n  if(b.dataset.st){S.street=b.dataset.st;document.querySelectorAll(\"[data-st]\").forEach(x=>x.setAttribute(\"aria-pressed\",x===b));}\n  if(b.dataset.o){S.order=b.dataset.o;S.seq=null;document.querySelectorAll(\"[data-o]\").forEach(x=>x.setAttribute(\"aria-pressed\",x===b));}\n  S.idx=0;S.picked=null;renderSpot();};\nconst msg=t=>{$(\"#pmsg\").textContent=t;setTimeout(()=>{$(\"#pmsg\").textContent=\"\";},4000);};\n$(\"#exp\").onclick=()=>{const blob=new Blob([JSON.stringify({answers:S.answers,exportedAt:new Date().toISOString()},null,1)],{type:\"application/json\"});\n  const a=document.createElement(\"a\");a.href=URL.createObjectURL(blob);a.download=\"sb-trainer-progress-\"+new Date().toISOString().slice(0,10)+\".json\";document.body.appendChild(a);a.click();a.remove();msg(\"Progress exported.\");};\n$(\"#imp\").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());const inc=d.answers||{};let n=0;\n  for(const [id,v] of Object.entries(inc)){const cur=S.answers[id];if(!cur||v.n>cur.n){S.answers[id]=v;n++;}}\n  save();renderSpot();msg(`Imported ${n} spot results.`);}catch(err){msg(\"That file isn't a progress export.\");} e.target.value=\"\";};\n$(\"#reset\").onclick=()=>{if(!confirm(\"Clear all quiz progress in this browser?\"))return;S.answers={};save();renderSpot();msg(\"Progress cleared.\");};\n$(\"#built\").textContent=`This file: ${S.spots.length} spots from ${S.sessions.length} sessions, built ${DATA.built}.`;\nrenderSessions();renderSummary();renderSpot();\n\u003c/script>\n\u003c/body>\u003c/html>\n"</script>
<script type="application/json" id="tool-turn-trainer">"\u003c!doctype html>\n\u003chtml lang=\"fr\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Turn Raise IP Trainer\u003c/title>\n\u003cstyle>:root{--bg:#121417;--panel:#1b1e23;--panel2:#23272e;--ink:#e8e6e1;--mute:#9aa0a8;--line:#30353d;--cell:#2a2e35;--raise:#d9483b;--call:#4caf63;--fold:#3d7fd1;--accent:#e2b84b;--good:#4caf63;--bad:#e0574a;--warn:#e2b84b}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 \"Inter\",system-ui,-apple-system,\"Segoe UI\",sans-serif}\na{color:var(--accent)}\nheader{padding:28px 20px 12px;max-width:1180px;margin:0 auto}\nh1{margin:0 0 4px;font-size:26px;letter-spacing:-.01em}\n.sub{color:var(--mute)}\nmain{max-width:1180px;margin:0 auto;padding:0 20px 60px}\n.card{display:inline-flex;align-items:baseline;justify-content:center;gap:1px;min-width:30px;padding:3px 5px;margin-right:3px;border-radius:5px;font-weight:700;font-size:16px;background:#f3f1ec;color:#222}\n.card i{font-style:normal;font-size:14px}\n.s-h,.s-d{color:#c62828}.s-c{color:#1b6e2f}.s-s{color:#222}\n.s-d{color:#1f5fbf}\n.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;width:100%;max-width:520px;aspect-ratio:1/1;user-select:none}\n.gc{position:relative;border-radius:3px;background:var(--cell);font-size:clamp(8px,1.6vw,12px);font-weight:600;display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 3px;overflow:hidden}\n.gc span{position:relative;z-index:1;text-shadow:0 0 3px #000}\n.gc.out{background:#181a1e!important;color:#4a4f57}\n.gc.out span{text-shadow:none}\n.gc.hero{outline:2px solid var(--accent);outline-offset:-2px}\n.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:8px}\n.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}\n.freqs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}\n.fq{padding:5px 9px;border-radius:6px;background:var(--panel2);border-left:4px solid var(--mute);font-size:13px}\n.fq b{display:block;font-size:16px}\n.fq.raise{border-color:var(--raise)}.fq.call{border-color:var(--call)}.fq.fold{border-color:var(--fold)}\n.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.02em}\n.pill.missed_raise{background:#4a2a12;color:#f0b26a}\n.pill.bad{background:#4a1a17;color:#ff8b80}\n.pill.good{background:#173a22;color:#7fdc95}\n.pill.mid{background:#3d3416;color:#f1d27a}\n.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}\n.btn:hover{border-color:var(--accent)}\n.btn.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}\n@media (max-width:760px){header{padding:20px 16px 8px}main{padding:0 16px 40px}}\n\n.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 16px}\n.filters{display:flex;gap:6px;flex-wrap:wrap}\n.filters .btn.on{border-color:var(--accent);color:var(--accent)}\n.goto{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mute)}\n.goto input{width:70px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit}\n.stats{display:flex;gap:16px;font-size:14px;color:var(--mute)}\n.stats b{color:var(--ink);font-size:18px}\n.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:780px}\n.choices.wait{opacity:.35;pointer-events:none}\n.meta{color:var(--mute);font-size:13px;margin-bottom:10px}\n.pos{font-size:22px;font-weight:800;margin-bottom:4px}\n.pos small{font-size:14px;font-weight:600;color:var(--mute);margin-left:8px}\n.row{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;margin:14px 0}\n.row h4{margin:0 0 6px;font-size:12px;color:var(--mute);text-transfor me':''}${vil?' vil':''}${act?' act':''}\" style=\"left:${sp.x}%;top:${sp.y}%\">\u003cdiv class=\"sc\">${cards}\u003c/div>\u003cdiv class=\"sn\">\u003cb>${p}${me?' · toi':''}\u003c/b>\u003cspan>${z.stack!=null?fmt(Math.max(0,z.stack))+' bb':(z.fold?'fold':'')}\u003c/span>\u003c/div>${p==='BTN'?'\u003ci class=\"dealer\">D\u003c/i>':''}\u003c/div>`;\n   if(z.bet>0)h+=`\u003cdiv class=\"chip\" style=\"left:${cp.x}%;top:${cp.y}%\">${fmt(z.bet)}\u003c/div>`;});\n  $q('.rp-seats').innerHTML=h;\n  $q('.rp-msg').innerHTML=(S.decision?'\u003cb>Décision : \u003c/b>':'')+S.msg;\n  $q('.rp-msg').classList.toggle('dec',!!S.decision);\n  $q('.rp-log').innerHTML=ST.slice(1,k+1).filter(x=>!x.fast).map(x=>`\u003cli class=\"${x.deal?'deal':''}\">${x.msg.replace(/ — à toi.*$/,'')}\u003c/li>`).join('');\n  if(S.decision&&onDecision){onDecision();}\n }\n // navigation manuelle ; les folds des joueurs non impliqués passent d'un coup\n const next=()=>{if(k>=ST.length-1)return;k++;while(k\u003cST.length-1&&ST[k].fast)k++;draw();};\n const prev=()=>{if(k\u003c=0)return;k--;while(k>0&&ST[k].fast)k--;draw();};\n el.querySelectorAll('.rp-ctl button').forEach(b=>b.onclick=()=>{const t=b.dataset.k;\n  if(t==='first'){k=0;draw();}else if(t==='prev')prev();else if(t==='next')next();else{k=ST.length-1;draw();}});\n if(window.__rpKey)document.removeEventListener('keydown',window.__rpKey);\n window.__rpKey=e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();next();}else if(e.key==='ArrowLeft'){e.preventDefault();prev();}};\n document.addEventListener('keydown',window.__rpKey);\n draw();\n return {next,prev,toEnd:()=>{k=ST.length-1;draw();},steps:ST,hand:H};\n}\nconst RP_CSS=`\n.rp{position:relative;width:100%;max-width:720px;aspect-ratio:16/10;margin:4px auto 6px}\n.felt{position:absolute;inset:9% 7%;border-radius:999px;background:radial-gradient(ellipse at 50% 40%,#2f7a52,#1d5238 70%,#163f2b);box-shadow:inset 0 0 0 8px #3b2a1c,inset 0 0 0 11px #59412b,0 10px 30px rgba(0,0,0,.35)}\n.rp-pot{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);color:#fff;font-size:14px;background:rgba(0,0,0,.35);padding:3px 10px;border-radius:999px;white-space:nowrap}\n.rp-board{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);display:flex;gap:5px}\n.rp-street{position:absolute;left:50%;top:74%;transform:translateX(-50%);color:rgba(255,255,255,.65);font:700 11px/1 var(--mono,monospace);letter-spacing:.12em;text-transform:uppercase}\n.rc{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:30px;height:42px;border-radius:5px;background:#fff;color:#111;font:800 15px/1 system-ui,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.4);margin:0 1px}\n.rc i{font-style:normal;font-size:14px;line-height:1}\n.rc.red{color:#d0222b}\n.rc.big{width:42px;height:58px;font-size:20px}.rc.big i{font-size:19px}\n.rc.back{background:repeating-linear-gradient(45deg,#7a1f2b 0 4px,#93303c 4px 8px);border:2px solid #fff}\n.st{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .2s}\n.st .sc{display:flex;min-height:42px}\n.st .sn{background:#1b1f24;color:#eef0ee;border:1px solid #39414a;border-radius:8px;padding:2px 9px;text-align:center;font-size:12px;line-height:1.25;min-width:64px}\n.st .sn b{display:block;font-size:12px}.st .sn span{color:#b9c2c9;font:600 11px var(--mono,monospace)}\n.st.me .sn{border-color:#f5b83d;box-shadow:0 0 0 1px #f5b83d}\n.st.vil .sn{border-color:#8fb3ff}\n.st.act .sn{background:#f5b83d;color:#111}.st.act .sn span{color:#111}\n.st.fold{opacity:.38}.st.fold .sc{visibility:hidden}\n.dealer{position:absolute;right:-14px;top:22px;width:18px;height:18px;border-radius:50%;background:#fff;color:#111;font:800 11px/18px system-ui;text-align:center;font-style:normal;box-shadow:0 1px 2px rgba(0,0,0,.5)}\n.chip{position:absolute;transform:translate(-50%,-50%);background:#f2f2f2;color:#111;border:3px dashed #c33;border-radius:999px;padding:1px 7px;font:700 11px var(--mono,monospace);box-shadow:0 1px 3px rgba(0,0,0,.4)}\n.rp-msg{text-align:center;font-size:15px;margin:2px 0 8px;min-height:22px}\n.rp-msg.dec{font-weight:700;color:var(--accent,#f5b83d)}\n.rp-ctl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}\n.rp-log{font-size:13px;color:var(--mute,#888);columns:2;column-gap:24px;margin:0 0 6px;padding-left:22px}\n.rp-log li.deal{color:var(--ink,#ddd);font-weight:700}\n@media (max-width:560px){.rp{aspect-ratio:10/11}.rc{width:24px;height:34px;font-size:12px}.rc i{font-size:11px}.rc.big{width:32px;height:45px;font-size:15px}.rc.big i{font-size:14px}.st .sn{min-width:52px;padding:2px 5px;font-size:11px}.felt{inset:12% 9%}.rp-log{columns:1}}\n`;\n\ndocument.head.insertAdjacentHTML('beforeend','\u003cstyle>'+RP_CSS+'\u003c/style>');\nconst LS='trip_trainer_v2';\nlet state={};try{state=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){state={}}\nconst save=()=>{try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}};\nfunction agg(g){let r=0,c=0,f=0;for(const [k,v] of Object.entries(g||{})){if(/^Call/.test(k))c+=v;else if(/^Fold/.test(k))f+=v;else r+=v;}return {raise:+r.toFixed(1),call:+c.toFixed(1),fold:+f.toFixed(1)};}\nfunction grade(a,pick){const v=a[pick],m=Math.max(a.raise,a.call,a.fold);if(v>=m-0.05||v>=50)return 'g';if(v>0)return 'm';return 'b';}\nconst LBL={fold:'Fold',call:'Call',raise:'Raise'};\nconst heroAct=s=>/^Raise/.test(s.hero)?'raise':/^Fold/.test(s.hero)?'fold':'call';\nlet filter='all',order=[],pos=0;\n// ordre et position mémorisés (par filtre) : on reprend où on s'était arrêté\nconst LSO='trip_trainer_order_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(LSO)||'{}')}catch(e){saved={}}\nconst saveOrder=()=>{saved[filter]={uids:order.map(i=>SPOTS[i].uid),pos};try{localStorage.setItem(LSO,JSON.stringify(saved))}catch(e){}};\nconst UID={};SPOTS.forEach((s,i)=>UID[s.uid]=i);\nfunction build(reshuffle){const pool=SPOTS.map((s,i)=>i).filter(i=>filter==='all'||(filter==='todo'?!state[SPOTS[i].uid]:SPOTS[i].kind===filter));\n const sv=saved[filter];\n if(!reshuffle&&sv&&sv.uids&&filter!=='todo'){const known=sv.uids.map(u=>UID[u]).filter(i=>i!=null&&pool.includes(i));const fresh=pool.filter(i=>!known.includes(i));order=known.concat(fresh);pos=Math.min(sv.pos||0,order.length);}\n else{order=pool.slice();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;}\n saveOrder();render();}\nfunction stats(){let g=0,m=0,b=0;for(const v of Object.values(state)){if(v.g==='g')g++;else if(v.g==='m')m++;else if(v.g==='b')b++;}sGood.textContent=g;sMix.textContent=m;sBad.textContent=b;}\nfunction splitLine(line){const i=line.lastIndexOf(' Turn ');return i\u003c0?[line,'']:[line.slice(0,i),line.slice(i+1)];}\nfunction render(){stats();const box=document.getElementById('box');\n if(!order.length){box.innerHTML='\u003cdiv class=\"done\">\u003cp>Aucun spot dans ce filtre.\u003c/p>\u003c/div>';sNum.textContent='–';return;}\n if(pos>=order.length){box.innerHTML=`\u003cdiv class=\"done\">\u003ch2>Série terminée\u003c/h2>\u003cp class=\"small\">${order.length} spots joués.\u003c/p>\u003cbutton class=\"btn primary\" onclick=\"build(true)\">Rejouer (nouvel ordre)\u003c/button>\u003c/div>`;sNum.textContent=order.length+'/'+order.length;return;}\n const s=SPOTS[order[pos]];sNum.textContent=(pos+1)+'/'+order.length;\n const [pre,turn]=splitLine(s.line||'');\n box.innerHTML=`\u003cdiv class=\"meta\">${s.tourn||''} · niv. ${s.lvl||'?'} · ${s.session} · tapis effectif ${s.eff} bb\u003c/div>\n  \u003cdiv class=\"pos\">${s.hp} vs ${s.vp}\u003csmall>tu es en position\u003c/small>\u003c/div>\n  \u003cdiv id=\"rpl\">\u003c/div>\n  \u003cdetails class=\"small\" style=\"margin:4px 0 8px\">\u003csummary>Résumé de la main (texte)\u003c/summary>\u003cdiv class=\"line\">${pre} ${turn}\u003c/div>\u003c/details>\n  \u003cdiv class=\"choices${state[s.uid]&&state[s.uid].pick?'':' wait'}\" id=\"choices\">${['fold','call','raise'].map(a=>`\u003cbutton class=\"choice ${a}\" data-a=\"${a}\">${LBL[a]}\u003c/button>`).join('')}\u003c/div>\n  \u003cdiv class=\"res\" id=\"res\">\u003c/div>\n  \u003cdiv class=\"nav\">\u003cbutton class=\"btn\" id=\"prev\" ${pos?'':'disabled'}>← Précédent\u003c/button>\u003cbutton class=\"btn primary\" id=\"next\">Suivant →\u003c/button>\u003c/div>`;\n box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(s,b.dataset.a));\n const rp=Replayer(document.getElementById('rpl'),s,()=>document.getElementById('choices').classList.remove('wait'));\n if(state[s.uid]&&state[s.uid].pick)rp.toEnd();\n prev.onclick=()=>{pos--;saveOrder();render();};next.onclick=()=>{pos++;saveOrder();render();};\n if(state[s.uid]&&state[s.uid].pick)answer(s,state[s.uid].pick,true);\n}\nfunction answer(s,pick,replay){const a=agg(s.gto),g=grade(a,pick);\n if(!replay){state[s.uid]={pick,g};save();stats();}\n document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;const k=b.dataset.a;b.innerHTML=`${LBL[k]}\u003csmall>GTO ${a[k]} %\u003c/small>`;if(k===pick)b.classList.add('picked');});\n const best=['raise','call','fold'].reduce((x,y)=>a[y]>a[x]?y:x);\n const vt={g:'Bonne réponse',m:'Dans le mix GTO',b:'Erreur'}[g];\n const sizes=Object.entries(s.gto||{}).filter(([k,v])=>!/^(Call|Fold)/.test(k)&&v>0).map(([k,v])=>`${k} : ${v} %`).join(' · ');\n const w=x=>x>=6?x+' %':'';\n res.innerHTML=`\u003cdiv class=\"verdict ${g}\">${vt} — tu as choisi ${LBL[pick]} (GTO ${a[pick]} %)\u003c/div>\n  \u003cdiv class=\"bars\">\u003cdiv class=\"r\" style=\"width:${a.raise}%\">${w(a.raise)}\u003c/div>\u003cdiv class=\"c\" style=\"width:${a.call}%\">${w(a.call)}\u003c/div>\u003cdiv class=\"f\" style=\"width:${a.fold}%\">${w(a.fold)}\u003c/div>\u003c/div>\n  \u003cdiv class=\"small\">Raise ${a.raise} % · Call ${a.call} % · Fold ${a.fold} % — action principale GTO : \u003cb>${LBL[best]}\u003c/b>${sizes?'\u003cbr>Tailles <script type="application/json" id="tool-river">"\u003c!doctype html>\n\u003chtml lang=\"fr\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>River Calls Review\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap\">\n\u003cstyle>\n:root{\n  --bg:#eef0f3; --surface:#fff; --ink:#151a22; --muted:#5d6675; --line:#d7dce3;\n  --felt:#23324a; --felt-ink:#e8eef7; --accent:#2c5fb3; --accent-soft:#e1e9f7;\n  --good:#2f8a55; --warn:#c48a12; --bad:#c2402f;\n  --s:#1b1f1d; --h:#d0332b; --d:#2f6fc4; --c:#2c8a45; --card:#fff;\n  --display:\"Barlow Semi Condensed\",\"Arial Narrow\",Arial,sans-serif;\n  --body:\"Source Sans 3\",\"Segoe UI\",system-ui,sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0f1218; --surface:#171c25; --ink:#e4e8ee; --muted:#939cab; --line:#273041;\n  --felt:#1a2638; --felt-ink:#dde6f2; --accent:#6c9cf0; --accent-soft:#1d2a40;\n  --good:#4cc07c; --warn:#e0a83a; --bad:#ec6a58; --card:#f4f6f8; color-scheme:dark}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:20px 16px 48px}\n.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}\nh1,h2{font-family:var(--display);margin:0;letter-spacing:.01em}\nh1{font-size:2rem;line-height:1.05}\n.eyebrow{font-family:var(--display);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}\nheader{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}\nselect,button{font:inherit;color:inherit}\nselect{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}\n.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}\n.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column}\n.stat b{font-family:var(--mono);font-size:1.4rem}\n.stat span{font-size:.85rem;color:var(--muted)}\n.stat.flag b{color:var(--bad)}\n.note{font-size:.92rem;color:var(--muted);margin:8px 0 0;max-width:72ch}\n.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.9rem;cursor:pointer}\n.chip[aria-pressed=\"true\"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n.call{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}\n.head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}\n.tag{font-size:.8rem;padding:2px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted);font-weight:600}\n.tag.bad{border-color:var(--bad);color:var(--bad)}.tag.close{border-color:var(--warn);color:var(--warn)}.tag.good{border-color:var(--good);color:var(--good)}\n.res{font-family:var(--mono);margin-left:auto}\n.res.neg{color:var(--bad)}.res.pos{color:var(--good)}\n.felt{background:var(--felt);color:var(--felt-ink);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px 22px;align-items:center}\n.cards{display:flex;gap:6px;flex-wrap:wrap}\n.card{width:42px;height:60px;border-radius:6px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;line-height:1}\n.card .r{font-size:1.35rem}.card .u{font-size:1rem}\n.card.s{color:var(--s)}.card.h{color:var(--h)}.card.d{color:var(--d)}.card.c{color:var(--c)}\n.lbl{font-family:var(--display);letter \">\u003cb>${v}\u003c/b>\u003cspan>${l}\u003c/span>\u003c/div>`;\n  $(\"#sum\").innerHTML=`\u003cdiv class=\"strip\">${st(cs.length,\"calls analysés\")}${st(bad.length,\"mauvais calls\",bad.length)}${st(close.length,\"calls limites\")}${st(fr(lost.toFixed(1))+\" bb\",\"sur les mauvais calls\",lost\u003c0)}\u003c/div>`+\n    (ss.length===1?`\u003cp class=\"note\">${esc(ss[0].note)}\u003c/p>`:`\u003cp class=\"note\">${ss.length} session(s).\u003c/p>`)+gains(ss);\n}\nfunction gains(ss){\n  ss=ss.filter(s=>s.riverCallStats); if(!ss.length) return \"\";\n  const agg=k=>{let n=0,t=0,w=0;ss.forEach(s=>{const b=k===\"tot\"?s.riverCallStats:s.riverCallStats.buckets.find(x=>x.label===k);if(b){n+=b.n;t+=b.totalBB;w+=b.won;}});return {n,t,w};};\n  const labels=ss[0].riverCallStats.buckets.map(b=>b.label);\n  const sg=v=>`\u003cspan class=\"${v\u003c0?\"neg\":\"pos\"}\">${v>0?\"+\":\"\"}${fr(v.toFixed(1))}\u003c/span>`;\n  const row=(l,x,strong)=>`\u003ctr${strong?' class=\"tot\"':\"\"}>\u003ctd>${l}\u003c/td>\u003ctd>${x.n}\u003c/td>\u003ctd>${x.w}\u003c/td>\u003ctd>${sg(x.t)} bb\u003c/td>\u003ctd>${x.n?sg(x.t/x.n):\"—\"} bb\u003c/td>\u003c/tr>`;\n  let h=`\u003cdiv class=\"gains\">\u003ch2>Gains sur tes calls river\u003c/h2>\u003cp class=\"note\" style=\"margin:2px 0 10px\">Tous tes calls river face à une mise, comparés à un fold : ce que tu ramasses moins ce que tu payes.\u003c/p>\n   \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mise adverse\u003c/th>\u003cth>Calls\u003c/th>\u003cth>Gagnés\u003c/th>\u003cth>Total\u003c/th>\u003cth>Moyenne / call\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${labels.map(l=>row(l,agg(l))).join(\"\")}${row(\"Total\",agg(\"tot\"),1)}\u003c/tbody>\u003c/table>\u003c/div>`;\n  if(ss.every(s=>s.riverCallStats.classes)){\n    const ca=(l,big)=>{let n=0,t=0,w=0;ss.forEach(s=>{const c=s.riverCallStats.classes.find(x=>x.label===l);if(c){const b=big?c.big:c;n+=b.n;t+=b.totalBB;w+=b.won;}});return {n,t,w};};\n    const cls=ss[0].riverCallStats.classes.map(c=>c.label);\n    h+=`\u003ch2 style=\"margin-top:16px\">Par force de main\u003c/h2>\u003cp class=\"note\" style=\"margin:2px 0 10px\">Bluffcatcher pur : ta main ne bat aucune main de value plausible (elle ne bat que des bluffs). Bluffcatcher : bat aussi un peu de value fine. Value : tu payes avec une main qui bat une bonne partie des mains de value.\u003c/p>\n     \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Main\u003c/th>\u003cth>Calls\u003c/th>\u003cth>Gagnés\u003c/th>\u003cth>Total\u003c/th>\u003cth>Moyenne / call\u003c/th>\u003cth>Dont mises ≥ 60 %\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${cls.map(l=>{const x=ca(l),b=ca(l,1);return `\u003ctr>\u003ctd>${l}\u003c/td>\u003ctd>${x.n}\u003c/td>\u003ctd>${x.w}\u003c/td>\u003ctd>${sg(x.t)} bb\u003c/td>\u003ctd>${x.n?sg(x.t/x.n):\"—\"} bb\u003c/td>\u003ctd>${b.n?`${sg(b.t)} bb (${b.n})`:\"—\"}\u003c/td>\u003c/tr>`;}).join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>`;\n  }\n  if(ss.length>1) h+=`\u003cdiv class=\"tw\" style=\"margin-top:10px\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Session\u003c/th>\u003cth>Calls\u003c/th>\u003cth>Total\u003c/th>\u003cth>Moyenne\u003c/th>\u003cth>≥ 85 % du pot\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${ss.slice().sort((a,b)=>a.id\u003cb.id?1:-1).map(s=>{const r=s.riverCallStats,b=r.buckets[r.buckets.length-1];return `\u003ctr>\u003ctd>${esc(s.label)}\u003c/td>\u003ctd>${r.n}\u003c/td>\u003ctd>${sg(r.totalBB)} bb\u003c/td>\u003ctd>${sg(r.avgBB)} bb\u003c/td>\u003ctd>${sg(b.totalBB)} bb (${b.n})\u003c/td>\u003c/tr>`;}).join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>`;\n  return h+`\u003c/div>`;\n}\nfunction list(){\n  const cs=DATA.calls.filter(c=>(S.session===\"all\"||c.session===S.session)&&(S.v===\"all\"||c.verdict===S.v)&&(S.c===\"all\"||c.handClass===S.c))\n    .sort((a,b)=>a.session===b.session?a.order-b.order:(a.session\u003cb.session?1:-1));\n  if(!cs.length){$(\"#list\").innerHTML=`\u003cdiv class=\"empty\">Aucun call dans cette vue.\u003c/div>`;return;}\n  $(\"#list\").innerHTML=cs.map(c=>{\n    const hide=S.quiz&&!S.shown[c.id];\n    const streets=Object.entries(c.streets).map(([k,a])=>[k,hide&&k===\"River\"?a.slice(0,-1):a]).map(([k,a])=>`\u003cdiv class=\"st\">\u003cb>${k}\u003c/b>${a.map(x=>x.startsWith(\"Toi\")?`\u003cspan class=\"me\">${esc(x)}\u003c/span>`:esc(x)).join(\"\u003cbr>\")}\u003c/div>`).join(\"\");\n    const max=Math.max(60,c.bluffsProfile+10,(c.goodThreshold||c.threshold)+10);\n    const col=c.verdict===\"bad\"?\"var(--bad)\":c.verdict===\"close\"?\"var(--warn)\":\"var(--good)\";\n    const reveal=hide?`\u003cdiv class=\"ask\">\u003cspan>Le vilain mise ${c.riverSizePct}% du pot à la river. Tu payes ou tu folds ?\u003c/span>\u003cbutton class=\"btn\" data-r=\"${c.id}\">Call\u003c/button>\u003cbutton class=\"btn\" data-r=\"${c.id}\">Fold\u003c/button>\u003c/div>`:\n     `\u003cdiv class=\"meter\">\u003cdiv class=\"row\">\u003cspan>Bluffs regs WWSF &gt; 46 · ${esc(c.texture)}\u003c/span>\u003cspan>\u003cb>${fr(c.bluffsProfile)} %\u003c/b> (${esc(c.sampleProfile)} mains) · seuil \u003cb>${fr(c.threshold)} %\u003c/b>${c.goodThreshold!=null?` · bon à partir de \u003cb>${fr(c.goodThreshold)} %\u003c/b>`:\"\"}\u003c/span>\u003c/div>\n       \u003cdiv class=\"bar\">\u003ci style=\"width:${c.bluffsProfile/max*100}%;background:${col}\">\u003c/i>\u003cu style=\"left:${c.threshold/max*100}%\">\u003c/u>${c.goodThreshold!=null?`\u003cu style=\"left:${c.goodThreshold/max*100}%;opacity:.55\">\u003c/u>`:\"\"}\u003c/div>\n       ${c.callEVPct!=null?`\u003cdiv class=\"row\">\u003cspan>EV du call\u003c/span>\u003cspan>\u003cb>${c.callEVPct>0?\"+\":\"\"}${fr(c.callEVPct)} % du pot\u003c/b> (bon au-dessus de +5 %)\u003c/span>\u003c/div>`:\"\"}\n       \u003cdiv class=\"row\">\u003cspan>Tous regs : ${fr(c.bluffsAllRegs)} % (${esc(c.sampleAllRegs)})\u003c/span>\u003cspan>Ligne Snap : \u003cb>${esc(c.snapLine)}\u003c/b> · ${esc(c.spot)}\u003c/span>\u003c/div>\u003c/div>\n      \u003cdiv class=\"verdict ${c.verdict}\">\u003cb>${VL[c.verdict]}\u003c/b>\u003cdiv>${esc(c.note)}\u003c/div>\u003c/div>\n      \u003cdiv class=\"meta\">Vilain montre : ${c.villainCards.length?c.villainCards.map(x=>x[0]+SUIT[x[1]]).join(\" \"):\"—\"}${c.multiway?\" · coup à 3 joueurs au flop (données heads-up)\":\"\"} · \u003ca href=\"${esc(c.snapUrl)}\" target=\"_blank\" rel=\"noopener\">Ouvrir dans Snap MDA\u003c/a> (ajoute le filtre WWSF &gt; 46 dans les réglages)\u003c/div>`;\n    return `\u003carticle class=\"call\">\u003cdiv class=\"head\">\u003cspan class=\"tag ${hide?\"\":c.verdict}\">${hide?\"À deviner\":VL[c.verdict]}\u003c/span>${c.handClass?`\u003cspan class=\"tag\">${esc(c.handClass)}\u003c/span>`:\"\"}\u003cspan>${esc(c.tournament)} · niveau ${c.level}\u003c/span>\u003cspan class=\"eyebrow\">${esc(c.session)}\u003c/span>\n      ${hide?\"\":`\u003cspan class=\"res ${c.resultBB\u003c0?\"neg\":\"pos\"}\">${c.resultBB>0?\"+\":\"\"}${fr(c.resultBB)} bb\u003c/span>`}\u003c/div>\n      \u003cdiv class=\"felt\">\u003cdiv>\u003cdiv class=\"lbl\">Toi\u003c/div>\u003cdiv class=\"cards\">${c.heroCards.map(card).join(\"\")}\u003c/div>\u003c/div>\n      \u003cdiv>\u003cdiv class=\"lbl\">Board\u003c/div>\u003cdiv class=\"cards\">${c.board.map(card).join(\"\")}\u003c/div>\u003c/div>\n      \u003cdiv class=\"streets\">${streets}\u003c/div>\u003c/div>\n      \u003cdiv class=\"body\">${reveal}\u003c/div>\u003c/article>`;}).join(\"\");\n  document.querySelectorAll(\"[data-r]\").forEach(b=>b.onclick=()=>{S.shown[b.dataset.r]=1;list();});\n}\n$(\"#sess\").onchange=e=>{S.session=e.target.value;summary();list();};\n$(\"#filters\").onclick=e=>{const b=e.target.closest(\".chip\");if(!b)return;\n  if(b.id===\"quiz\"){S.quiz=!S.quiz;S.shown={};b.setAttribute(\"aria-pressed\",S.quiz);}\n  else{S.v=b.dataset.v;document.querySelectorAll(\"[data-v]\").forEach(x=>x.setAttribute(\"aria-pressed\",x===b));}\n  list();};\n$(\"#cfilters\").onclick=e=>{const b=e.target.closest(\".chip\");if(!b)return;S.c=b.dataset.c;document.querySelectorAll(\"[data-c]\").forEach(x=>x.setAttribute(\"aria-pressed\",x===b));list();};\nsess();summary();list();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

<script>
const M = JSON.parse(document.getElementById('meta').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtBB = x => (x > 0 ? '+' : '') + String(x).replace('.', ',') + ' bb';

/* semaines */
const wk = M.weeks, cur = wk.findIndex(w => w.cur);
$('#weeksel').innerHTML = wk.slice().reverse().map(w => `<option value="${esc(w.file)}"${w.cur ? ' selected' : ''}>${esc(w.label)}</option>`).join('');
$('#weeksel').onchange = e => { location.href = encodeURI(e.target.value) + location.hash; };
$('#prev').disabled = cur <= 0; $('#next').disabled = cur < 0 || cur >= wk.length - 1;
$('#prev').onclick = () => { location.href = encodeURI(wk[cur - 1].file) + location.hash; };
$('#next').onclick = () => { location.href = encodeURI(wk[cur + 1].file) + location.hash; };

/* chiffres par outil */
function stats(t) {
  const s = t.st || {};
  if (t.id === 'sb') return [[s.missed_defense, 'défenses ratées', 'bad'], [s.checkraise, 'check-raises ratés', 'bad'], [s.bad_checkraise, 'mauvais check-raises', s.bad_checkraise ? 'bad' : ''], [s.decoys, 'leurres', '']];
  if (t.id === 'turn-trainer') return [[s.n, 'spots à jouer', ''], [s.missed, 'raises ratés', 'bad'], [s.hero, 'tes raises', '']];
  if (t.id === 'turn-review') return [[s.missed, 'raises ratés', 'bad'], [s.hero - s.bad, 'bons raises', 'good'], [s.bad, 'mauvais raises', s.bad ? 'bad' : '']];
  if (t.id === 'river') return [[s.n, 'gros calls', ''], [s.bad, 'mauvais', 'bad'], [s.close, 'limites', ''], [s.badBB ? fmtBB(s.badBB) : null, 'sur les mauvais', 'bad']];
  return [];
}
function count(t) { return t.st ? t.st.n : 0; }


/* évolution semaine par semaine */
const E = M.evo || {weeks:[], metrics:[]};
const nf = (x,d=1) => x==null ? '—' : x.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
function evoHTML(){
  if(!E.weeks.length) return '';
  const cards = E.metrics.map(mt=>{
    const pts = E.weeks.map((w,i)=>({i,w,v:w.vals[mt.id]})).filter(p=>p.v);
    if(!pts.length) return `<div class="ec"><h3>${esc(mt.label)}</h3><div class="sub">${esc(mt.desc)}</div><div class="none">Pas encore revu.</div></div>`;
    const cur = pts.find(p=>p.w.cur) || pts[pts.length-1];
    const prev = pts.filter(p=>p.i<cur.i);
    let trend = '';
    if(prev.length){
      const avg = prev.reduce((a,p)=>a+p.v.rate,0)/prev.length, d = cur.v.rate-avg;
      const cls = Math.abs(d)<0.05*Math.max(avg,0.5) ? 'flat' : d<0 ? 'down' : 'up';
      trend = `<span class="trend ${cls}" title="par rapport à la moyenne des semaines précédentes">${cls==='down'?'▼':cls==='up'?'▲':'='} ${d>0?'+':''}${nf(d)} vs moyenne</span>`;
    }
    const W=300,H=118,L=30,R=10,T=10,B=22, n=E.weeks.length;
    const max = Math.max(1, ...pts.map(p=>p.v.rate)); const top = Math.ceil(max*1.15*2)/2;
    const x = i => n===1 ? L+(W-L-R)/2 : L + i*(W-L-R)/(n-1);
    const y = v => T + (H-T-B)*(1 - v/top);
    let path='', on=false;
    E.weeks.forEach((w,i)=>{const v=w.vals[mt.id]; if(v){path+=(on?'L':'M')+x(i).toFixed(1)+' '+y(v.rate).toFixed(1); on=true;} else on=false;});
    const ticks = [0, top/2, top];
    const lbl = new Set([0, n-1, E.weeks.findIndex(w=>w.cur)]);
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(mt.label)} pour 1000 mains, par semaine">
      ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L-6}" y="${y(t)+4}" text-anchor="end">${nf(t, t%1?1:0)}</text>`).join('')}
      ${E.weeks.map((w,i)=>lbl.has(i)?`<text class="ax" x="${x(i)}" y="${H-4}" text-anchor="${i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'}">${w.short}</text>`:'').join('')}
      <path class="ln" d="${path}"/>
      ${pts.map(p=>`<circle class="pt${p.w.cur?' cur':''}" cx="${x(p.i)}" cy="${y(p.v.rate)}" r="${p.w.cur?5:4}"/>`).join('')}
      ${pts.map(p=>`<circle class="hit" cx="${x(p.i)}" cy="${y(p.v.rate)}" r="13" data-tip="${esc(p.w.label)}|${nf(p.v.rate,2)}|${p.v.n}|${p.v.hands}"/>`).join('')}
    </svg>`;
    return `<div class="ec${mt.big?' big':''}"><h3>${esc(mt.label)}</h3><div class="sub">${esc(mt.desc)}</div>
      <div class="now"><b>${nf(cur.v.rate,2)}</b><span>pour 1 000 mains${cur.w.cur?' cette semaine':' ('+cur.w.short+')'} · ${cur.v.n} sur ${cur.v.hands.toLocaleString('fr-FR')} mains</span>${trend}</div>${svg}</div>`;
  }).join('');
  const table = `<details class="tbl"><summary>Voir le tableau</summary><div class="tw"><table><thead><tr><th>Semaine</th><th>Mains</th>${E.metrics.map(m=>`<th>${esc(m.label)}</th>`).join('')}</tr></thead><tbody>${
    E.weeks.slice().reverse().map(w=>`<tr class="${w.cur?'cur':''}"><td>${esc(w.label.replace('Semaine du ',''))}</td><td>${w.hands.toLocaleString('fr-FR')}</td>${E.metrics.map(m=>{const v=w.vals[m.id];return `<td>${v?nf(v.rate,2)+' <span style="color:var(--muted)">('+v.n+')</span>':'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  return `<section style="display:flex;flex-direction:column;gap:12px" aria-label="Évolution">
    <div class="evo-head"><h2>Ton évolution</h2><span class="note">Erreurs pour 1 000 mains, semaine par semaine (semaines sans jeu ignorées). Plus bas = mieux.</span></div>
    <div class="evo">${cards}</div>${table}
    <p class="note">Une revue encore en cours (par exemple les spots turn restants) n'est comptée que lorsqu'elle est terminée.</p>
  </section>`;
}

/* accueil */
const T = M.tools, sb = (T.find(t => t.id === 'sb') || {}).st || {}, tr = (T.find(t => t.id === 'turn-review') || {}).st || {}, rc = (T.find(t => t.id === 'river') || {}).st || {};
const errors = (sb.missed_defense || 0) + (sb.checkraise || 0) + (sb.bad_checkraise || 0) + (tr.missed || 0) + (tr.bad || 0) + (rc.bad || 0);
const kpis = [
  [M.days.length, M.days.length > 1 ? 'sessions analysées' : 'session analysée', ''],
  sb.hands ? [sb.hands.toLocaleString('fr-FR'), 'mains', ''] : null,
  sb.tournaments ? [sb.tournaments, 'tournois', ''] : null,
  [(sb.n || 0) + (tr.n || 0) + (rc.n || 0), 'spots revus', ''],
  [errors, 'erreurs à travailler', errors ? 'bad' : ''],
].filter(Boolean);
$('#homein').innerHTML = `
  <header>
    <div class="eyebrow">bardasphocas · Winamax MTT</div>
    <h1>${esc(M.label)}</h1>
    <div class="days">${M.daysLabel.length ? M.daysLabel.map(d => `<span class="day">${esc(d)}</span>`).join('') : '<span class="note">Aucune session analysée cette semaine.</span>'}</div>
  </header>
  <section class="kpis" aria-label="Chiffres de la semaine">${kpis.map(([v, l, c]) => `<div class="kpi ${c}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</section>
  <section class="cards">${T.map(t => `
    <div class="card${t.has ? '' : ' off'}" ${t.has ? `role="button" tabindex="0" data-go="${t.id}"` : 'aria-disabled="true"'}>
      <div class="top"><h2>${esc(t.name)}</h2><span class="tag">${esc(t.kind)}</span></div>
      <p>${esc(t.desc)}</p>
      <div class="stats">${t.has ? stats(t).filter(x => x[0] !== null && x[0] !== undefined).map(([v, l, c]) => `<span class="stat ${c}"><b>${esc(v)}</b>${esc(l)}</span>`).join('') + '<span class="go" style="margin-left:auto">Ouvrir →</span>' : '<span class="stat">Rien cette semaine</span>'}</div>
    </div>`).join('')}
  </section>
  ${evoHTML()}
  <p class="note">Construit le ${esc(M.built)} à partir des données de chaque outil. Ta progression dans les trainers est gardée par ton navigateur.</p>`;
document.querySelectorAll('[data-go]').forEach(el => {
  el.onclick = () => go(el.dataset.go);
  el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(el.dataset.go); } };
});

/* infobulles */
const tip=document.createElement('div');tip.className='tip';tip.hidden=true;document.body.appendChild(tip);
document.addEventListener('pointerover',e=>{const t=e.target.closest('[data-tip]');if(!t)return;const [l,r,n,h]=t.dataset.tip.split('|');
  tip.innerHTML=`${esc(l)}<br><b>${r}</b> pour 1 000 mains<br>${n} erreur${n>1?'s':''} sur ${(+h).toLocaleString('fr-FR')} mains`;tip.hidden=false;
  const b=t.getBoundingClientRect();tip.style.left=Math.min(innerWidth-250,Math.max(8,b.left+b.width/2-110))+'px';tip.style.top=(b.top-tip.offsetHeight-8)+'px';});
document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))tip.hidden=true;});

/* onglets */
$('#tabs').innerHTML = `<button class="tab" role="tab" data-tab="home">Accueil</button>` +
  T.map(t => `<button class="tab" role="tab" data-tab="${t.id}"${t.has ? '' : ' disabled'}>${esc(t.name)}<span class="c">${count(t)}</span></button>`).join('');
$('#tabs').onclick = e => { const b = e.target.closest('.tab'); if (b && !b.disabled) go(b.dataset.tab); };

const frames = {};
function show(id) {
  const tool = T.find(t => t.id === id && t.has);
  if (!tool) id = 'home';
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === id));
  $('#home').hidden = id !== 'home';
  $('#frames').hidden = id === 'home';
  if (id !== 'home') {
    if (!frames[id]) {
      const f = document.createElement('iframe');
      f.className = 'frame'; f.title = tool.name;
      f.srcdoc = JSON.parse(document.getElementById('tool-' + id).textContent);
      $('#frames').appendChild(f); frames[id] = f;
    }
    Object.entries(frames).forEach(([k, f]) => f.hidden = k !== id);
  }
  document.title = (tool ? tool.name + ' · ' : '') + M.label;
}
function go(id) { if (location.hash !== '#' + id) location.hash = id; else show(id); }
addEventListener('hashchange', () => show(location.hash.slice(1) || 'home'));
show(location.hash.slice(1) || 'home');
</script>
</body></html>
